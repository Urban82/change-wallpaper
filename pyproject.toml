[tool.poetry]
name = "change-wallpaper"
version = "0.1.0"
description = "Set a face-aware, per-monitor random wallpaper on X11/Xorg"
authors = ["urban"]
readme = "README.md"
packages = [{ include = "change_wallpaper" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pillow = ">=10.0"
numpy = ">=2.3"
opencv-python-headless = ">=4.10"
python-xlib = ">=0.33"

[tool.poetry.scripts]
change-wallpaper = "change_wallpaper.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
