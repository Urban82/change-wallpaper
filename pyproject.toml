[project]
name = "change-wallpaper"
version = "0.1.0"
description = "Set a face-aware, per-monitor random wallpaper on X11/Xorg"
authors = [{ name = "Danilo Treffiletti", email = "urban82@gmail.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pillow>=10.0",
    "numpy>=2.3",
    "opencv-python-headless>=4.10",
    "python-xlib>=0.33",
]

[project.scripts]
change-wallpaper = "change_wallpaper.cli:main"

[tool.poetry]
packages = [{ include = "change_wallpaper" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
